name: Stability Audit

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    paths:
      - 'ykt-helper/**'
      - '.github/workflows/stability-audit.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ykt-helper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ykt-helper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Check built artifact syntax
        run: node --check dist/ykt-helper-1221.user.js

  archive-retired-branches:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[retire-branches-20261022]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: archive-retired-branches-20261022
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive and remove reviewed branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/retire-branches.py --apply

