name: Apply Timeline Live Fix

on:
  push:
    branches:
      - fix/stability-auto-answer-20260916
    paths:
      - '.github/workflows/apply-timeline-live-fix.yml'

permissions:
  contents: write

jobs:
  apply-test-build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/stability-auto-answer-20260916
          fetch-depth: 0

      - name: Apply deterministic timeline fix
        run: python3 .github/scripts/apply-timeline-live-fix.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ykt-helper/package-lock.json

      - name: Install dependencies
        working-directory: ykt-helper
        run: npm ci

      - name: Run full regression suite
        working-directory: ykt-helper
        run: npm test

      - name: Build userscript
        working-directory: ykt-helper
        run: npm run build

      - name: Prepare 1.21.6.2 field-test userscript
        shell: bash
        run: |
          cp ykt-helper/dist/ykt-helper-1216.user.js release/ykt-helper-1216-stability-test.user.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('release/ykt-helper-1216-stability-test.user.js')
          text = p.read_text(encoding='utf-8')
          old = '// @version      1.21.6'
          new = '// @version      1.21.6.2'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one version header, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          test -s release/ykt-helper-1216-stability-test.user.js
          grep -q '// @version      1.21.6.2' release/ykt-helper-1216-stability-test.user.js
          grep -q 'timeline-live' release/ykt-helper-1216-stability-test.user.js
          grep -q '检测到实时新增题目' release/ykt-helper-1216-stability-test.user.js
          grep -q 'autoAnswerEnabled' release/ykt-helper-1216-stability-test.user.js

      - name: Commit only verified source and field-test artifact
        shell: bash
        run: |
          # The generated bundle preserves a few historical trailing spaces; source files remain strict.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ykt-helper/src release/ykt-helper-1216-stability-test.user.js
          git diff --cached --check -- ykt-helper/src
          git diff --cached --stat
          git commit -m "fix: recover live questions from timeline deltas"
          git push origin HEAD:fix/stability-auto-answer-20260916
